<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Repair Agent Listings</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8ee;
    --muted: #8a90a0;
    --accent: #4da3ff;
    --hover: #1e222b;
    --yes: #3ecf8e;
    --no: #ff5d5d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
  }

  .load-btn {
    background: var(--accent);
    color: #0b0e14;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .load-btn:hover { filter: brightness(1.1); }

  #file-meta {
    color: var(--muted);
    font-size: 13px;
  }

  #error {
    display: none;
    margin: 16px 24px;
    padding: 12px 16px;
    background: #2a1215;
    border: 1px solid #5a2228;
    border-radius: 6px;
    color: #ff9aa3;
    font-size: 14px;
  }

  .tabs {
    display: flex;
    gap: 4px;
    padding: 12px 24px 0;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }

  .tab {
    background: transparent;
    border: 1px solid transparent;
    border-bottom: none;
    color: var(--muted);
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
    border-radius: 6px 6px 0 0;
  }

  .tab:hover { color: var(--text); }

  .tab.active {
    background: var(--bg);
    border-color: var(--border);
    color: var(--text);
    font-weight: 600;
  }

  .tab .count {
    color: var(--muted);
    font-weight: 400;
    margin-left: 6px;
    font-size: 12px;
  }

  main {
    padding: 24px;
    overflow-x: auto;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
    min-width: 900px;
  }

  thead th {
    position: sticky;
    top: 58px;
    background: var(--panel);
    color: var(--muted);
    text-align: left;
    font-weight: 600;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }

  thead th:hover { color: var(--text); background: var(--hover); }

  thead th .arrow { color: var(--accent); margin-left: 4px; }

  tbody td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }

  tbody tr:hover { background: var(--hover); }

  .num { text-align: right; font-variant-numeric: tabular-nums; }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .flag { font-weight: 700; }
  .flag.yes { color: var(--yes); }
  .flag.no { color: var(--no); }

  .muted { color: var(--muted); }

  #placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 80px 24px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
  <header>
    <h1>Repair Agent Listings</h1>
    <button class="load-btn" id="load-btn">Choose JSON file</button>
    <span id="file-meta"></span>
  </header>

  <div id="error"></div>
  <div class="tabs" id="tabs"></div>

  <main id="main">
    <div id="placeholder">
      <div>No file loaded.</div>
      <button class="load-btn" id="load-btn-2">Choose JSON file</button>
    </div>
  </main>

  <input type="file" id="file-input" accept=".json,application/json" hidden />

  <script>
    const COLUMNS = [
      { key: "title", label: "Title", sort: "text", link: "url" },
      { key: "price", label: "Price", sort: "num" },
      { key: "currency", label: "Currency", sort: "text" },
      { key: "condition", label: "Condition", sort: "text" },
      { key: "shipping_cost", label: "Shipping", sort: "num" },
      { key: "shipping_cost_type", label: "Ship Type", sort: "text" },
      { key: "total_cost", label: "Total", sort: "num" },
      { key: "item_id", label: "Item ID", sort: "text" },
      { key: "controllers", label: "Controllers", sort: "bool", path: "included.controllers" },
      { key: "games", label: "Games", sort: "bool", path: "included.games" },
      { key: "cords", label: "Cords", sort: "bool", path: "included.cords" },
    ];

    const input = document.getElementById("file-input");
    const tabsEl = document.getElementById("tabs");
    const mainEl = document.getElementById("main");
    const errorEl = document.getElementById("error");
    const metaEl = document.getElementById("file-meta");

    let data = null;
    let activeProduct = null;
    let sortState = null;

    function valueAt(item, key, path) {
      if (path) {
        return path.split(".").reduce((obj, part) => (obj == null ? obj : obj[part]), item);
      }
      return item[key];
    }

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = "block";
    }

    function clearError() {
      errorEl.style.display = "none";
    }

    function parseNumber(v) {
      const n = parseFloat(v);
      return Number.isFinite(n) ? n : 0;
    }

    function compareValues(a, b, col) {
      if (col.sort === "num") {
        return parseNumber(a) - parseNumber(b);
      }
      if (col.sort === "bool") {
        return (a ? 1 : 0) - (b ? 1 : 0);
      }
      const sa = String(a == null ? "" : a).toLowerCase();
      const sb = String(b == null ? "" : b).toLowerCase();
      return sa < sb ? -1 : sa > sb ? 1 : 0;
    }

    function renderTabs() {
      tabsEl.innerHTML = "";
      const products = Object.keys(data);
      products.forEach((product) => {
        const count = Array.isArray(data[product]) ? data[product].length : 0;
        const tab = document.createElement("button");
        tab.className = "tab" + (product === activeProduct ? " active" : "");
        tab.innerHTML = `${escapeHtml(product)}<span class="count">${count}</span>`;
        tab.addEventListener("click", () => {
          activeProduct = product;
          sortState = null;
          renderTabs();
          renderTable();
        });
        tabsEl.appendChild(tab);
      });
    }

    function renderTable() {
      mainEl.innerHTML = "";
      if (!activeProduct) return;

      const listings = data[activeProduct];
      if (!Array.isArray(listings)) return;

      const rows = listings.slice();
      if (sortState) {
        const col = COLUMNS.find((c) => c.key === sortState.key);
        rows.sort((x, y) => {
          const ax = valueAt(x, col.key, col.path);
          const by = valueAt(y, col.key, col.path);
          return compareValues(ax, by, col) * (sortState.dir === "asc" ? 1 : -1);
        });
      }

      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");

      COLUMNS.forEach((col) => {
        const th = document.createElement("th");
        if (col.sort === "num") th.className = "num";
        const label = document.createElement("span");
        label.textContent = col.label;
        th.appendChild(label);
        if (sortState && sortState.key === col.key) {
          const arrow = document.createElement("span");
          arrow.className = "arrow";
          arrow.textContent = sortState.dir === "asc" ? "▲" : "▼";
          th.appendChild(arrow);
        }
        th.addEventListener("click", () => {
          if (sortState && sortState.key === col.key) {
            sortState.dir = sortState.dir === "asc" ? "desc" : "asc";
          } else {
            sortState = { key: col.key, dir: "asc" };
          }
          renderTable();
        });
        headRow.appendChild(th);
      });

      thead.appendChild(headRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      rows.forEach((item) => {
        const tr = document.createElement("tr");
        COLUMNS.forEach((col) => {
          const td = document.createElement("td");
          const value = valueAt(item, col.key, col.path);

          if (col.link) {
            const href = item[col.link];
            if (href) {
              const a = document.createElement("a");
              a.href = href;
              a.target = "_blank";
              a.rel = "noopener noreferrer";
              a.textContent = value == null ? "" : String(value);
              td.appendChild(a);
            } else {
              td.textContent = value == null ? "" : String(value);
            }
          } else if (col.sort === "bool") {
            const span = document.createElement("span");
            span.className = "flag " + (value ? "yes" : "no");
            span.textContent = value ? "✓" : "✗";
            td.appendChild(span);
          } else if (col.sort === "num") {
            td.className = "num";
            td.textContent = value == null || value === "" ? "" : String(value);
          } else {
            td.textContent = value == null ? "" : String(value);
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      mainEl.appendChild(table);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[ch]));
    }

    function loadFile(file) {
      clearError();
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (parsed == null || typeof parsed !== "object" || Array.isArray(parsed)) {
            throw new Error("Expected a JSON object keyed by product.");
          }
          data = parsed;
          activeProduct = Object.keys(data)[0] || null;
          sortState = null;
          metaEl.textContent = file.name;
          renderTabs();
          renderTable();
        } catch (err) {
          data = null;
          activeProduct = null;
          tabsEl.innerHTML = "";
          mainEl.innerHTML = "";
          metaEl.textContent = "";
          showError("Could not parse file as JSON: " + err.message);
        }
      };
      reader.onerror = () => showError("Failed to read file.");
      reader.readAsText(file);
    }

    document.getElementById("load-btn").addEventListener("click", () => input.click());
    document.getElementById("load-btn-2").addEventListener("click", () => input.click());
    input.addEventListener("change", () => {
      if (input.files && input.files[0]) {
        loadFile(input.files[0]);
      }
      input.value = "";
    });
  </script>
</body>
</html>
